[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-risk-scoring"
version = "0.1.0"
description = "Transparent, configurable KYC customer risk scoring with explainable results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ara Avetisyan" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kyc-score = "kyc_risk_scoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyc_risk_scoring = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
